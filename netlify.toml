[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Paddle client tokens, environments, and catalog IDs are intentionally
  # embedded in browser code. Server-side credentials remain fully scanned.
  # Retell's "public key" is designed for direct browser use (domain-scoped),
  # and both Retell values are rendered into the page as data-* attributes.
  SECRETS_SCAN_OMIT_KEYS = "PADDLE_ENVIRONMENT,PUBLIC_PADDLE_ENVIRONMENT,PUBLIC_PADDLE_CLIENT_TOKEN,PUBLIC_PADDLE_BASIC_MONTHLY_PRICE_ID,PUBLIC_PADDLE_BASIC_ANNUAL_PRICE_ID,PUBLIC_PADDLE_PRO_MONTHLY_PRICE_ID,PUBLIC_PADDLE_PRO_ANNUAL_PRICE_ID,PUBLIC_PADDLE_PLUS_MONTHLY_PRICE_ID,PUBLIC_PADDLE_PLUS_ANNUAL_PRICE_ID,PUBLIC_PADDLE_MAX_MONTHLY_PRICE_ID,PUBLIC_PADDLE_MAX_ANNUAL_PRICE_ID,PUBLIC_PADDLE_SETUP_FEE_PRICE_ID,PUBLIC_RETELL_VOICE_PUBLIC_KEY,PUBLIC_RETELL_VOICE_AGENT_ID"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
